version: "1.1.5"
cache: true

endpoints:
  agents:
    recursionLimit: 25

fileConfig:
  endpoints:
    default:
      fileLimit: 30
      fileSizeLimit: 50
      totalSizeLimit: 100
    google:
      fileLimit: 30

interface:
  codeExecution: true
  htmlArtifacts: true
  reactArtifacts: true

webSearch:
  searchProvider: tavily
  scraperProvider: tavily
  tavilyApiKey: "${TAVILY_API_KEY}"
  rerankerType: "none"

memory:
  disabled: false
  personalize: true
  tokenLimit: 2000
  messageWindowSize: 5
  validKeys:
    - 'user_preferences'

